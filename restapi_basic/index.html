<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student List</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { width: 60%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #007bff; color: white; }
        .error { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Registered Students</h2>
    <div id="statusMessage"></div>
    <table id="studentTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Course</th>
            </tr>
        </thead>
        <tbody>
            <!-- Student rows will be injected here by JavaScript -->
        </tbody>
    </table>

    <script>
        async function fetchStudents() {
            const messageDiv = document.getElementById('statusMessage');
            const tableBody = document.querySelector('#studentTable tbody');
            
            try {
                // Fetching data from the REST API via GET
                const response = await fetch('/api/students', { method: 'GET' });
                
                // Handling different HTTP response codes
                if (response.ok) { // HTTP 200-299
                    const students = await response.json();
                    
                    if (students.length === 0) {
                        tableBody.innerHTML = '<tr><td colspan="3">No students found.</td></tr>';
                        return;
                    }

                    // Populate the table
                    students.forEach(student => {
                        const row = `<tr>
                            <td>${student.id}</td>
                            <td>${student.name}</td>
                            <td>${student.course}</td>
                        </tr>`;
                        tableBody.innerHTML += row;
                    });
                } else if (response.status === 404) {
                    messageDiv.innerHTML = '<p class="error">Error 404: Student endpoint not found.</p>';
                } else if (response.status === 500) {
                    messageDiv.innerHTML = '<p class="error">Error 500: Internal server error.</p>';
                } else {
                    messageDiv.innerHTML = `<p class="error">Error ${response.status}: Failed to retrieve data.</p>`;
                }
            } catch (error) {
                messageDiv.innerHTML = '<p class="error">Network error: Could not connect to the server.</p>';
            }
        }

        // Trigger the fetch request when the page loads
        window.onload = fetchStudents;
    </script>
</body>
</html>
